spring.application.name=nutrivida-ventas
server.port=${PORT:8084}
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3307/nutrivida_ventas?connectionTimeZone=UTC}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
springdoc.api-docs.path=/v3/api-docs
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
spring.security.user.password=${INTERNAL_UNUSED_PASSWORD:${random.uuid}}

app.jwt.public-key=${JWT_PUBLIC_KEY}
app.frontend-origins=${FRONTEND_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}
app.users-url=${USERS_URL:http://127.0.0.1:8081}

spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'
